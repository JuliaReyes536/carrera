<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrera de la Muerte – Control de pilotos</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS DE DISEÑO ============ */
:root{
  --asphalt:#141211; --road:#1f1c1a; --plate:#2a2623; --line:#3d3631;
  --bone:#e9e0d2; --dust:#a39a8d;
  --blood:#e0201b; --rust:#d2691e; --toxic:#d9f21b; --gold:#ffc83d;
  --display:'Black Ops One',Impact,'Arial Black',sans-serif;
  --body:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{
  background:
    repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.015) 22px 23px),
    var(--asphalt);
  color:var(--bone);font-family:var(--body);font-size:1.15rem;line-height:1.3;min-height:100vh;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--toxic);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:1rem}

/* ============ ENCABEZADO + CRONÓMETRO ============ */
header{border-bottom:6px solid var(--rust);background:var(--road);
  background-image:repeating-linear-gradient(-45deg,var(--toxic) 0 14px,#000 14px 28px);
  background-size:100% 8px;background-repeat:no-repeat;background-position:top}
header .wrap{padding-top:1.6rem;display:grid;gap:1rem;grid-template-columns:1fr auto;align-items:center}
h1{font-family:var(--display);font-size:clamp(2rem,6vw,3.6rem);line-height:.95;color:var(--rust);
  text-shadow:3px 3px 0 #000}
h1 small{display:block;font-family:var(--body);font-size:1.1rem;color:var(--dust);text-shadow:none;font-weight:500;margin-top:.4rem}
.clock{background:#000;border:3px solid var(--line);padding:.5rem 1rem;text-align:center;min-width:290px}
.clock output{display:block;font-family:var(--display);font-size:clamp(2.2rem,7vw,3.2rem);color:var(--toxic);
  font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(217,242,27,.45)}
.clock.running output{animation:pulse 1.6s steps(2) infinite}
@keyframes pulse{50%{text-shadow:0 0 4px rgba(217,242,27,.2)}}
.clock-btns{display:flex;gap:.4rem;margin-top:.4rem}
.clock-btns button{flex:1}

/* ============ BOTONES ============ */
.btn{cursor:pointer;border:2px solid var(--line);background:var(--plate);padding:.45rem .8rem;
  font-weight:700;letter-spacing:.03em;transition:transform .08s,background .15s}
.btn:hover{background:var(--line)} .btn:active{transform:translateY(2px)}
.btn.go{background:var(--toxic);color:#000;border-color:var(--toxic)}
.btn.hot{background:var(--blood);border-color:var(--blood);color:#fff}
.btn.rust{background:var(--rust);border-color:var(--rust);color:#000}

/* ============ ESTADÍSTICAS ============ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin:1.2rem 0}
.stat{background:var(--road);border:2px solid var(--line);padding:.7rem 1rem}
.stat b{display:block;font-family:var(--display);font-size:clamp(2rem,6vw,3rem);line-height:1}
.stat span{color:var(--dust)}
.stat.active b{color:var(--toxic)}
/* El contador de eliminados es el elemento protagonista */
.stat.dead{background:var(--blood);border-color:#ff5a4d;color:#fff;transform:scale(1.04);
  box-shadow:0 0 0 3px #000,0 0 28px rgba(224,32,27,.55)}
.stat.dead span{color:#ffd9d5} .stat.dead b{font-size:clamp(2.6rem,8vw,4rem)}
.stat.dead.hit b{animation:slam .5s}
@keyframes slam{0%{transform:scale(2.2);opacity:.3}60%{transform:scale(.9)}100%{transform:scale(1)}}

/* ============ FORMULARIO ============ */
form{background:var(--road);border:2px solid var(--line);border-left:8px solid var(--rust);
  padding:1rem;display:grid;gap:.8rem;grid-template-columns:repeat(4,1fr) auto;align-items:end;margin-bottom:1.4rem}
form h2{grid-column:1/-1;font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--gold)}
label{display:grid;gap:.2rem;color:var(--dust)}
input{background:#000;border:2px solid var(--line);padding:.5rem .6rem;width:100%;border-radius:0}
input:focus{border-color:var(--toxic);outline:none}
.formbtns{display:flex;gap:.4rem}
#err{grid-column:1/-1;color:#ff7b6e;min-height:1.2em}

/* ============ CUADRÍCULA DE PILOTOS ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1rem;padding-bottom:3rem}
.card{background:var(--plate);border:2px solid var(--line);border-top:6px solid var(--toxic);padding:.9rem;
  display:grid;gap:.6rem;position:relative;overflow:hidden;transition:filter .4s,border-color .3s}
.card .num{position:absolute;right:.6rem;top:-.3rem;font-family:var(--display);font-size:3.4rem;color:rgba(255,255,255,.07)}
.card h3{font-size:1.5rem;line-height:1}
.card .alias{color:var(--rust);font-weight:700}
.card .veh{color:var(--dust)}
.badge{justify-self:start;font-weight:700;padding:.1rem .6rem;background:#000;border:2px solid currentColor}
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}
.states button{padding:.4rem 0;font-size:1.3rem;border:2px solid var(--line);background:#000;cursor:pointer}
.states button:hover{border-color:var(--bone)}
.states button.on{background:var(--bone);border-color:var(--bone)}
.tools{display:flex;gap:.4rem}.tools .btn{flex:1;font-size:1rem;padding:.25rem}

/* Colores por estado */
.card.activo{border-top-color:var(--toxic)} .card.activo .badge{color:var(--toxic)}
.card.penalizado{border-top-color:var(--gold)} .card.penalizado .badge{color:var(--gold)}
.card.ganador{border-top-color:var(--gold);background:linear-gradient(160deg,#4a3a10,var(--plate));
  box-shadow:0 0 22px rgba(255,200,61,.35)} .card.ganador .badge{color:var(--gold)}
.card.eliminado{border-top-color:var(--blood);filter:grayscale(.85) brightness(.7)}
.card.eliminado h3{text-decoration:line-through;text-decoration-color:var(--blood);text-decoration-thickness:3px}
.card.eliminado .badge{color:var(--blood)}

/* Animaciones: explosión al eliminar, salida al borrar */
.card.boom{animation:boom .6s}
@keyframes boom{0%{filter:none;transform:translateX(0)}15%{transform:translateX(-8px);background:var(--blood)}
  30%{transform:translateX(8px)}45%{transform:translateX(-5px)}100%{transform:translateX(0)}}
.card.out{animation:out .35s forwards}
@keyframes out{to{opacity:0;transform:scale(.7) rotate(-4deg)}}
.empty{grid-column:1/-1;text-align:center;color:var(--dust);padding:2.5rem 1rem;border:2px dashed var(--line)}

/* ============ RESPONSIVE ============ */
@media(max-width:860px){form{grid-template-columns:1fr 1fr}.formbtns{grid-column:1/-1}}
@media(max-width:620px){
  header .wrap{grid-template-columns:1fr}.clock{min-width:0}
  .stats{gap:.4rem}.stat{padding:.5rem}form{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Carrera de la Muerte<small>Control de pilotos y tiempo de supervivencia</small></h1>
    <div class="clock" id="clock">
      <output id="time" aria-live="off">00:00:00.0</output>
      <div class="clock-btns">
        <button class="btn go" id="bStart">Iniciar</button>
        <button class="btn rust" id="bPause">Pausar</button>
        <button class="btn hot" id="bReset">Reiniciar</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- Panel de estadísticas: se recalcula en cada render() -->
  <section class="stats" aria-label="Estadísticas">
    <div class="stat"><b id="sTotal">0</b><span>Pilotos registrados</span></div>
    <div class="stat active"><b id="sActive">0</b><span>Activos en carrera</span></div>
    <div class="stat dead" id="deadBox"><b id="sDead">0</b><span>Eliminados / destruidos</span></div>
  </section>

  <!-- Formulario: sirve para crear y para editar -->
  <form id="form" novalidate>
    <h2 id="formTitle">Registrar piloto</h2>
    <label>Nombre del piloto<input id="fName" maxlength="40" required></label>
    <label>Alias<input id="fAlias" maxlength="30" required></label>
    <label>Tipo de vehículo<input id="fVeh" maxlength="40" required></label>
    <label>Número de corredor<input id="fNum" type="number" min="0" max="999" required></label>
    <div class="formbtns">
      <button class="btn go" type="submit" id="fSubmit">Registrar</button>
      <button class="btn" type="button" id="fCancel" hidden>Cancelar</button>
    </div>
    <p id="err" role="alert"></p>
  </form>

  <!-- Panel de control -->
  <section class="grid" id="grid" aria-label="Pilotos"></section>
</main>

<script>
"use strict";
/* ============ ESTADO + PERSISTENCIA (LocalStorage) ============ */
const KEY_RACERS = "cdm_racers", KEY_CLOCK = "cdm_clock";
const STATES = {
  activo:     {icon:"🟢", label:"Activo / En carrera"},
  eliminado:  {icon:"🔴", label:"Eliminado / Destruido"},
  penalizado: {icon:"🟡", label:"Penalizado"},
  ganador:    {icon:"🏆", label:"Ganador"}
};
const load = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let racers = load(KEY_RACERS, []);               // [{id,name,alias,vehicle,number,status}]
let clock  = load(KEY_CLOCK, {elapsed:0, startedAt:null}); // startedAt guardado => sigue corriendo al recargar
let editingId = null, lastDead = null;

const $ = id => document.getElementById(id);
// Escapa HTML para que lo que escriba el usuario no rompa la página
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const persist = () => save(KEY_RACERS, racers);

/* ============ RENDER: estadísticas + tarjetas ============ */
function render(){
  const dead = racers.filter(r => r.status === "eliminado").length;
  $("sTotal").textContent  = racers.length;
  $("sActive").textContent = racers.filter(r => r.status === "activo").length;
  $("sDead").textContent   = dead;
  // Animación "golpe" solo cuando sube el número de eliminados
  if (lastDead !== null && dead > lastDead){
    $("deadBox").classList.remove("hit"); void $("deadBox").offsetWidth; $("deadBox").classList.add("hit");
  }
  lastDead = dead;

  $("grid").innerHTML = racers.length ? racers.map(r => `
    <article class="card ${r.status}" data-id="${r.id}">
      <span class="num">#${esc(r.number)}</span>
      <h3>${esc(r.name)}</h3>
      <div class="alias">«${esc(r.alias)}»</div>
      <div class="veh">🚗 ${esc(r.vehicle)} · Corredor #${esc(r.number)}</div>
      <span class="badge">${STATES[r.status].label}</span>
      <div class="states" role="group" aria-label="Cambiar estado">
        ${Object.entries(STATES).map(([k,s]) =>
          `<button data-act="state" data-state="${k}" title="${s.label}" aria-label="${s.label}"
            class="${r.status===k?'on':''}">${s.icon}</button>`).join("")}
      </div>
      <div class="tools">
        <button class="btn" data-act="edit">Editar</button>
        <button class="btn hot" data-act="del">Eliminar</button>
      </div>
    </article>`).join("")
    : `<p class="empty">El asfalto está vacío. Registra al primer piloto arriba.</p>`;
}

/* ============ ACCIONES SOBRE TARJETAS (delegación de eventos) ============ */
$("grid").addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]"); if (!btn) return;
  const card = btn.closest(".card"), r = racers.find(x => x.id === card.dataset.id);
  if (!r) return;

  if (btn.dataset.act === "state"){
    const was = r.status; r.status = btn.dataset.state;
    if (was === r.status) return;
    persist(); render();
    // Sacudida de la tarjeta al ser destruido
    if (r.status === "eliminado")
      document.querySelector(`[data-id="${r.id}"]`).classList.add("boom");
  }
  if (btn.dataset.act === "edit") startEdit(r);
  if (btn.dataset.act === "del"){
    if (!confirm(`¿Borrar a ${r.name} («${r.alias}») para siempre?`)) return;
    card.classList.add("out");                       // animación de salida
    setTimeout(() => {
      racers = racers.filter(x => x.id !== r.id);
      if (editingId === r.id) resetForm();
      persist(); render();
    }, 330);
  }
});

/* ============ FORMULARIO: crear / editar ============ */
function startEdit(r){
  editingId = r.id;
  $("fName").value = r.name; $("fAlias").value = r.alias;
  $("fVeh").value = r.vehicle; $("fNum").value = r.number;
  $("formTitle").textContent = "Editar piloto"; $("fSubmit").textContent = "Guardar cambios";
  $("fCancel").hidden = false; $("err").textContent = "";
  $("form").scrollIntoView({behavior:"smooth", block:"center"}); $("fName").focus();
}
function resetForm(){
  editingId = null; $("form").reset();
  $("formTitle").textContent = "Registrar piloto"; $("fSubmit").textContent = "Registrar";
  $("fCancel").hidden = true; $("err").textContent = "";
}
$("fCancel").addEventListener("click", resetForm);

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const data = {
    name: $("fName").value.trim(), alias: $("fAlias").value.trim(),
    vehicle: $("fVeh").value.trim(), number: $("fNum").value.trim()
  };
  if (Object.values(data).some(v => !v)) return $("err").textContent = "Completa los cuatro campos.";
  // El número de corredor debe ser único
  if (racers.some(r => r.number === data.number && r.id !== editingId))
    return $("err").textContent = `El número ${data.number} ya está en uso. Elige otro.`;

  if (editingId) Object.assign(racers.find(r => r.id === editingId), data);
  else racers.push({id: crypto.randomUUID?.() ?? String(Date.now()+Math.random()), ...data, status:"activo"});
  persist(); resetForm(); render();
});

/* ============ CRONÓMETRO ============ */
// Tiempo total = acumulado + tiempo desde el último "Iniciar". Se guarda startedAt,
// así el cronómetro sigue contando aunque se cierre la pestaña.
const now = () => clock.elapsed + (clock.startedAt ? Date.now() - clock.startedAt : 0);
const pad = n => String(n).padStart(2, "0");
function paintClock(){
  const t = now(), s = Math.floor(t / 1000);
  $("time").textContent = `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}.${Math.floor(t%1000/100)}`;
  $("clock").classList.toggle("running", !!clock.startedAt);
}
$("bStart").onclick = () => { if (!clock.startedAt){ clock.startedAt = Date.now(); save(KEY_CLOCK, clock); } };
$("bPause").onclick = () => {
  if (clock.startedAt){ clock = {elapsed: now(), startedAt: null}; save(KEY_CLOCK, clock); paintClock(); }
};
$("bReset").onclick = () => {
  if (now() > 0 && !confirm("¿Reiniciar el cronómetro a cero?")) return;
  clock = {elapsed:0, startedAt:null}; save(KEY_CLOCK, clock); paintClock();
};
setInterval(paintClock, 100);

/* ============ ARRANQUE ============ */
render(); paintClock();
</script>
</body>
</html>
